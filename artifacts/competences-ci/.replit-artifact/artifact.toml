kind = "web"
previewPath = "/"
title = "Compétences CI"
version = "1.0.0"
id = "artifacts/competences-ci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21789
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/competences-ci run dev"

[services.env]
PORT = "21789"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/competences-ci", "run", "build"]
publicDir = "artifacts/competences-ci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
