<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Compétences CI" />
    <meta name="theme-color" content="#F77F00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a0d00" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Découvrez les écoles, instituts et concours de la fonction publique en Côte d'Ivoire." />
    <meta name="application-name" content="Compétences CI" />

    <!-- Open Graph -->
    <meta property="og:title" content="Compétences CI" />
    <meta property="og:description" content="L'orientation scolaire et professionnelle en Côte d'Ivoire" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />

    <title>Compétences CI</title>

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- iOS splash screen meta tags -->
    <meta name="apple-touch-startup-image" content="/apple-touch-icon.png" />

    <!-- Prevent flash of unstyled content -->
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('competences_ci_settings') || '{}');
          if (s.theme === 'dark') document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
