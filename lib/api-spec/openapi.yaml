openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Compétences CI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schools
    description: School operations
  - name: competitions
    description: Competition operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List all schools with optional filters
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [public, private]
        - name: diploma
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"

  /schools/{id}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get a school by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: School detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List all competitions with optional filters
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: diploma
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, upcoming]
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get a competition by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities:
    get:
      operationId: listCities
      tags: [schools]
      summary: List all cities
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /diplomas:
    get:
      operationId: listDiplomas
      tags: [schools]
      summary: List all diploma levels
      responses:
        "200":
          description: List of diplomas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    School:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [public, private]
        city:
          type: string
        address:
          type: string
        diplomas:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            type: string
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        description:
          type: string
      required:
        - id
        - name
        - type
        - city
        - address
        - diplomas
        - domains
        - description

    SchoolDetail:
      allOf:
        - $ref: "#/components/schemas/School"
        - type: object
          properties:
            email:
              type: string
              nullable: true
            founded:
              type: integer
              nullable: true
            accreditation:
              type: string
              nullable: true

    Competition:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        ministry:
          type: string
        city:
          type: string
        diploma:
          type: string
        status:
          type: string
          enum: [open, closed, upcoming]
        openDate:
          type: string
          format: date
          nullable: true
        closeDate:
          type: string
          format: date
          nullable: true
        positions:
          type: integer
        description:
          type: string
      required:
        - id
        - title
        - ministry
        - city
        - diploma
        - status
        - positions
        - description

    CompetitionDetail:
      allOf:
        - $ref: "#/components/schemas/Competition"
        - type: object
          properties:
            requirements:
              type: array
              items:
                type: string
            process:
              type: array
              items:
                type: string
            contact:
              type: string
              nullable: true
            website:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
