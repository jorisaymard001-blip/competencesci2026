openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Compétences CI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: schools
  - name: competitions
  - name: auth
  - name: messages
  - name: notifications
  - name: assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /assistant:
    post:
      operationId: askAssistant
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantQuestionInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReply"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantErrorResponse"
        "413":
          description: Question is too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantErrorResponse"

  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [public, private] }
        - name: diploma
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"

  /schools/{id}:
    get:
      operationId: getSchool
      tags: [schools]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: School detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: diploma
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, upcoming] }
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Competition detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities:
    get:
      operationId: listCities
      tags: [schools]
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /diplomas:
    get:
      operationId: listDiplomas
      tags: [schools]
      responses:
        "200":
          description: List of diplomas
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List all platform notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: createNotification
      tags: [notifications]
      summary: Create a new notification (admin/internal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    School:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [public, private]
        city: { type: string }
        address: { type: string }
        diplomas:
          type: array
          items: { type: string }
        domains:
          type: array
          items: { type: string }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        description: { type: string }
        imageUrl: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isVerified: { type: integer, enum: [0, 1] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        verificationSource: { type: ["string", "null"] }
      required: [id, name, type, city, address, diplomas, domains, description, isVerified, verifiedAt, verificationSource]

    SchoolDetail:
      allOf:
        - $ref: "#/components/schemas/School"
        - type: object
          properties:
            email: { type: string, nullable: true }
            founded: { type: integer, nullable: true }
            accreditation: { type: string, nullable: true }

    Competition:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        ministry: { type: string }
        city: { type: string }
        diploma: { type: string }
        status:
          type: string
          enum: [open, closed, upcoming]
        openDate: { type: string, format: date, nullable: true }
        closeDate: { type: string, format: date, nullable: true }
        positions: { type: integer }
        description: { type: string }
        imageUrl: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isVerified: { type: integer, enum: [0, 1] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        verificationSource: { type: ["string", "null"] }
      required: [id, title, ministry, city, diploma, status, positions, description, isVerified, verifiedAt, verificationSource]

    CompetitionDetail:
      allOf:
        - $ref: "#/components/schemas/Competition"
        - type: object
          properties:
            requirements:
              type: array
              items: { type: string }
            process:
              type: array
              items: { type: string }
            contact: { type: string, nullable: true }
            website: { type: string, nullable: true }

    RegisterRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [user]

    UserProfile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
      required: [id, name, email]

    SendMessageRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        subject: { type: string }
        message: { type: string }
      required: [name, email, subject, message]

    MessageResponse:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
      required: [id, message]

    Notification:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        type: { type: string }
        referenceId: { type: integer, nullable: true }
        referenceType: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, title, body, type, createdAt]

    CreateNotificationRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        type: { type: string }
        referenceId: { type: integer, nullable: true }
        referenceType: { type: string, nullable: true }
      required: [title, body, type]

    AssistantQuestionInput:
      type: object
      properties:
        question: { type: string, minLength: 1, maxLength: 1200 }
      required: [question]

    AssistantReply:
      type: object
      properties:
        response: { type: string }
      required: [response]

    AssistantErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    ErrorResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
